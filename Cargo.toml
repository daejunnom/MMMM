[workspace]
members = [
    "tools/mmmm-xtask", "crates/mmmm-contracts", "crates/mmmm-domain",
    "crates/mmmm-runtime",
    "crates/mmmm-adapters", "crates/mmmm-reference",
    "crates/mmmm-application",
    "crates/mmmm-policy",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/daejunnom/MMMM"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
libc = "0.2"
ctrlc = "3.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = 1

[profile.test]
debug = 1

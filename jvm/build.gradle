plugins { id 'base' }

allprojects {
    group = 'io.github.daejunnom.mmmm'
    version = '0.1.0'
    def ownedCache = new File(System.getenv('GRADLE_USER_HOME')).canonicalFile.parentFile
    layout.buildDirectory = new File(ownedCache, "gradle-build/${project.name}")
    repositories { mavenCentral() }
}

// This opt-in task observes development artifacts; the managed runner owns their admission.
tasks.register('mmmmDevelopmentJars') {
    group = 'verification'
    description = 'Observe freshly executed development JAR producers for the managed runner'
    dependsOn ':fabric-host:assemble', ':definition-observer:jar', ':provider-sdk:jar'

    doLast {
        def reject = { String reason ->
            throw new GradleException("Development JAR observation rejected: ${reason}")
        }
        def sourceSha = System.getProperty('mmmm.ci.sourceSha', '')
        def target = System.getProperty('mmmm.developmentJars.target', '')
        def evidenceValue = System.getProperty('mmmm.developmentJars.evidence', '')
        if (!(sourceSha ==~ /[0-9a-f]{40}/)) {
            reject('invalid source SHA')
        }
        if (!(target in ['windows-x64', 'linux-x64', 'macos-arm64'])) {
            reject('invalid target')
        }
        if (evidenceValue.isEmpty() || evidenceValue.length() > 4096) {
            reject('invalid evidence directory')
        }
        def noFollow = [java.nio.file.LinkOption.NOFOLLOW_LINKS] as java.nio.file.LinkOption[]
        def defaultFs = java.nio.file.FileSystems.getDefault()
        def provider = defaultFs.provider()
        def providerClass = provider.getClass()
        boolean windowsOwnedMode = (providerClass.getName() == 'sun.nio.fs.WindowsFileSystemProvider'
            && providerClass.getModule().getName() == 'java.base'
            && providerClass.getClassLoader() == null && provider.getScheme() == 'file')
        if ((target == 'windows-x64') != windowsOwnedMode) {
            reject('Windows target and actual default file provider do not match')
        }
        def readOptions = [java.nio.file.StandardOpenOption.READ,
            java.nio.file.LinkOption.NOFOLLOW_LINKS]
        def outputOptions = [java.nio.file.StandardOpenOption.CREATE_NEW,
            java.nio.file.StandardOpenOption.READ, java.nio.file.StandardOpenOption.WRITE,
            java.nio.file.LinkOption.NOFOLLOW_LINKS]
        if (windowsOwnedMode) {
            // Public Windows share guards are mandatory; there is no guardless retry.
            readOptions.add(com.sun.nio.file.ExtendedOpenOption.NOSHARE_WRITE)
            readOptions.add(com.sun.nio.file.ExtendedOpenOption.NOSHARE_DELETE)
            outputOptions.add(com.sun.nio.file.ExtendedOpenOption.NOSHARE_WRITE)
            outputOptions.add(com.sun.nio.file.ExtendedOpenOption.NOSHARE_DELETE)
        }
        def physical = { java.nio.file.Path input, boolean directory ->
            if (input.fileSystem != defaultFs || !input.isAbsolute()
                || input.toString().length() > 4096 || input.nameCount > 128) {
                reject('invalid physical path')
            }
            def path = input.normalize()
            def cursor = path.root
            def directoryMetadata = []
            def leaf = java.nio.file.Files.readAttributes(cursor,
                java.nio.file.attribute.BasicFileAttributes, noFollow)
            if (!leaf.isDirectory() || leaf.isSymbolicLink() || leaf.isOther()
                || cursor.toRealPath() != cursor.toRealPath(noFollow)) {
                reject('unsafe filesystem root')
            }
            directoryMetadata.add([path: cursor, created: leaf.creationTime()])
            for (def segment : path) {
                cursor = cursor.resolve(segment)
                leaf = java.nio.file.Files.readAttributes(cursor,
                    java.nio.file.attribute.BasicFileAttributes, noFollow)
                if (leaf.isSymbolicLink() || leaf.isOther()
                    || (cursor != path && !leaf.isDirectory())
                    || cursor.toRealPath() != cursor.toRealPath(noFollow)) {
                    reject('link or non-directory ancestor')
                }
                if (leaf.isDirectory()) {
                    directoryMetadata.add([path: cursor, created: leaf.creationTime()])
                }
            }
            if ((directory && !leaf.isDirectory()) || (!directory && !leaf.isRegularFile())) {
                reject('unexpected physical file kind')
            }
            def real = path.toRealPath()
            if (real != path.toRealPath(noFollow) || (!windowsOwnedMode && leaf.fileKey() == null)) {
                reject('unproven physical identity')
            }
            [path: path, real: real, attributes: leaf, directoryMetadata: directoryMetadata]
        }
        def sameBoundary = { before, after ->
            if (before.path != after.path || before.real != after.real) {
                return false
            }
            if (windowsOwnedMode) {
                // Owned-slot observations, not stable file IDs or locked directory handles.
                return (before.directoryMetadata == after.directoryMetadata
                    && before.attributes.creationTime() == after.attributes.creationTime())
            }
            (before.attributes.fileKey() != null
                && before.attributes.fileKey() == after.attributes.fileKey())
        }
        def sameFile = { before, after ->
            (sameBoundary(before, after)
                && before.attributes.size() == after.attributes.size()
                && before.attributes.lastModifiedTime() == after.attributes.lastModifiedTime()
                && before.attributes.creationTime() == after.attributes.creationTime())
        }
        def cacheValue = System.getenv('GRADLE_USER_HOME')
        if (cacheValue == null || cacheValue.isEmpty()) {
            reject('missing managed Gradle directory')
        }
        def cachePath = java.nio.file.Path.of(cacheValue)
        if (!cachePath.isAbsolute() || cachePath.parent == null) {
            reject('invalid managed Gradle directory')
        }
        def buildRoot = physical(cachePath.parent.resolve('gradle-build'), true)
        def evidenceRoot = physical(java.nio.file.Path.of(evidenceValue), true)
        def checkout = rootProject.projectDir.parentFile.toPath().toAbsolutePath().normalize()
        if (evidenceRoot.path.startsWith(checkout) || evidenceRoot.real.startsWith(checkout)
            || evidenceRoot.path.startsWith(buildRoot.path)
            || evidenceRoot.real.startsWith(buildRoot.real)) {
            reject('evidence directory is not external to source and build output')
        }

        def graphTasks = gradle.taskGraph.allTasks
        if (graphTasks.isEmpty() || graphTasks.size() > 512) {
            reject('task graph exceeds its bound')
        }
        def graph = new LinkedHashSet(graphTasks)
        def dependencyClosure = { Collection seeds ->
            def visited = new LinkedHashSet()
            def pending = new ArrayDeque()
            seeds.each { pending.addLast(it) }
            while (!pending.isEmpty()) {
                def item = pending.removeFirst()
                if (visited.add(item)) {
                    if (visited.size() > 512) {
                        reject('dependency closure exceeds its bound')
                    }
                    def dependencies = item.taskDependencies.getDependencies(item)
                    if (dependencies.size() > 512) {
                        reject('dependency edge set exceeds its bound')
                    }
                    dependencies.each { dependency ->
                        if (!visited.contains(dependency)) {
                            pending.addLast(dependency)
                        }
                    }
                }
            }
            visited
        }
        def unclassifiedJar = { producer ->
            (producer instanceof AbstractArchiveTask
                && producer.archiveExtension.getOrElse('') == 'jar'
                && producer.archiveClassifier.getOrElse('') == '')
        }
        def executedArchive = { producer ->
            def state = producer.state
            if (!graph.contains(producer) || !unclassifiedJar(producer)
                || !state.executed || !state.didWork || state.upToDate
                || state.skipped || state.noSource || state.failure != null) {
                reject('archive producer was not freshly executed successfully')
            }
        }
        def fabricProject = project(':fabric-host')
        def assemble = fabricProject.tasks.named('assemble').get()
        def assembleClosure = dependencyClosure([assemble])
        def candidates = assembleClosure.findAll { producer ->
            graph.contains(producer) && producer.project == fabricProject && unclassifiedJar(producer)
        }
        def terminals = candidates.findAll { candidate ->
            !candidates.any { other ->
                other != candidate && dependencyClosure([other]).contains(candidate)
            }
        }
        if (terminals.size() != 1) {
            reject('Fabric assemble does not identify one terminal archive producer')
        }
        def fabric = terminals.first()
        executedArchive(fabric)
        def selections = [
            [role: 'fabric_host', producer: fabric],
            [role: 'definition_observer', producer: project(':definition-observer').tasks.named('jar').get()],
            [role: 'provider_sdk', producer: project(':provider-sdk').tasks.named('jar').get()]
        ]
        def heldArchives = []
        Throwable primaryFailure = null
        long fileLimit = 64L * 1024 * 1024
        try {
            def selectedPaths = new LinkedHashSet()
            for (def selection : selections) {
                def producer = selection.producer
                executedArchive(producer)
                def before = physical(producer.archiveFile.get().asFile.toPath(), false)
                if (!before.path.startsWith(buildRoot.path) || !before.real.startsWith(buildRoot.real)
                    || !selectedPaths.add(before.real) || before.attributes.size() <= 0
                    || before.attributes.size() > fileLimit) {
                    reject('archive path, uniqueness, or byte bound failed')
                }
                def channel = java.nio.channels.FileChannel.open(before.path,
                    readOptions as java.nio.file.OpenOption[])
                heldArchives.add([selection: selection, before: before, channel: channel])
                if (channel.size() != before.attributes.size()
                    || !sameFile(before, physical(before.path, false))) {
                    reject('archive boundary changed while opening its guarded channel')
                }
            }

            def fabricFile = heldArchives.first().before
            def runtime = fabricProject.configurations.getByName('runtimeElements')
            def runtimeJars = runtime.outgoing.artifacts.findAll { artifact ->
                artifact.extension == 'jar' && (artifact.classifier ?: '') == ''
            }
            if (runtimeJars.size() != 1) {
                reject('Fabric runtimeElements does not expose one unclassified JAR')
            }
            def runtimeArtifact = runtimeJars.first()
            def runtimeFile = physical(runtimeArtifact.file.toPath(), false)
            if (!sameFile(fabricFile, runtimeFile)) {
                reject('Fabric outgoing artifact does not match the selected archive')
            }
            def runtimeSeeds = runtimeArtifact.buildDependencies.getDependencies(fabric)
            if (runtimeSeeds.size() > 512) {
                reject('outgoing build dependency set exceeds its bound')
            }
            def runtimeClosure = dependencyClosure(runtimeSeeds)
            def sameOutputOwners = graph.findAll { producer ->
                (producer instanceof AbstractArchiveTask
                    && producer.archiveFile.get().asFile.toPath().toAbsolutePath().normalize() == fabricFile.path)
            }
            if (!runtimeClosure.contains(fabric) || sameOutputOwners.size() != 1
                || sameOutputOwners.first() != fabric) {
                reject('Fabric outgoing archive producer ownership is ambiguous')
            }

            def artifacts = []
            long totalBytes = 0
            for (def held : heldArchives) {
                def selection = held.selection
                def producer = selection.producer
                def before = held.before
                def channel = held.channel
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                long observed = 0
                if (channel.size() != before.attributes.size()
                    || !sameFile(before, physical(before.path, false))) {
                    reject('archive boundary changed before reading')
                }
                def buffer = java.nio.ByteBuffer.allocate(65536)
                while (true) {
                    int count = channel.read(buffer)
                    if (count < 0) {
                        break
                    }
                    if (count == 0) {
                        reject('archive read made no progress')
                    }
                    observed += count
                    if (observed > fileLimit || observed > before.attributes.size()) {
                        reject('archive stream exceeded its byte bound')
                    }
                    buffer.flip()
                    digest.update(buffer)
                    buffer.clear()
                }
                if (observed != before.attributes.size() || channel.size() != observed
                    || !sameFile(before, physical(before.path, false))) {
                    reject('archive boundary or size changed while reading')
                }
                totalBytes += observed
                if (totalBytes > 192L * 1024 * 1024) {
                    reject('combined archives exceed their byte bound')
                }
                def relative = buildRoot.path.relativize(before.path).toString().replace('\\', '/')
                artifacts.add([
                    role: selection.role, project_path: producer.project.path, task_path: producer.path,
                    archive_extension: 'jar', classifier: '', relative_path: relative,
                    bytes: observed, sha256: java.util.HexFormat.of().formatHex(digest.digest()),
                    producer_status: 'executed'
                ])
            }
            if (!sameBoundary(buildRoot, physical(buildRoot.path, true))
                || !sameBoundary(evidenceRoot, physical(evidenceRoot.path, true))) {
                reject('managed directory boundary changed')
            }
            def metadata = [schema: 'mmmm-development-jar-artifacts/1', development_only: true,
                source_sha: sourceSha, target: target,
                physical_identity_mode: windowsOwnedMode ? 'windows-owned-slot-share-guarded' : 'basic-file-key',
                directory_identity_mode: windowsOwnedMode ? 'owned-slot-physical-metadata-recheck' : 'basic-file-key',
                artifacts: artifacts]
            byte[] encoded = groovy.json.JsonOutput.toJson(metadata)
                .getBytes(java.nio.charset.StandardCharsets.UTF_8)
            if (encoded.length == 0 || encoded.length > 65536) {
                reject('artifact metadata exceeds its byte bound')
            }
            def destination = evidenceRoot.path.resolve('development-jars-artifacts.json')
            java.nio.channels.FileChannel.open(destination,
                outputOptions as java.nio.file.OpenOption[]).withCloseable { channel ->
                def buffer = java.nio.ByteBuffer.wrap(encoded)
                while (buffer.hasRemaining()) {
                    if (channel.write(buffer) <= 0) {
                        reject('metadata write made no progress')
                    }
                }
                channel.force(true)
                def written = physical(destination, false)
                if (channel.size() != encoded.length || written.attributes.size() != encoded.length) {
                    reject('metadata write length mismatch')
                }
                channel.position(0)
                def readBack = java.nio.ByteBuffer.allocate(encoded.length)
                while (readBack.hasRemaining()) {
                    if (channel.read(readBack) <= 0) {
                        reject('metadata read-back made no progress')
                    }
                }
                if (channel.read(java.nio.ByteBuffer.allocate(1)) != -1
                    || !java.util.Arrays.equals(encoded, readBack.array())
                    || !sameFile(written, physical(destination, false))
                    || !sameBoundary(evidenceRoot, physical(evidenceRoot.path, true))) {
                    reject('metadata bytes or boundary changed while guarded')
                }
            }
            for (def held : heldArchives) {
                if (held.channel.size() != held.before.attributes.size()
                    || !sameFile(held.before, physical(held.before.path, false))) {
                    reject('archive boundary changed before observation completed')
                }
            }
        } catch (Throwable failure) {
            primaryFailure = failure
            throw failure
        } finally {
            Throwable closeFailure = null
            for (int index = heldArchives.size() - 1; index >= 0; index--) {
                try {
                    heldArchives[index].channel.close()
                } catch (Throwable failure) {
                    if (closeFailure == null) {
                        closeFailure = failure
                    } else {
                        closeFailure.addSuppressed(failure)
                    }
                }
            }
            if (closeFailure != null) {
                if (primaryFailure != null) {
                    primaryFailure.addSuppressed(closeFailure)
                } else {
                    throw closeFailure
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.withType(Test).configureEach {
        // Managed Test CWD; fixture/source root stays in mmmm.checkout.
        def managedScratch = System.getenv('TMP') ?: System.getenv('TMPDIR')
        if (managedScratch == null || !new File(managedScratch).isAbsolute()) {
            throw new GradleException('Tests require an absolute managed scratch directory')
        }
        def testWork = new File(managedScratch, "jvm-test-work/${project.name}/${name}")
        workingDir testWork
        doFirst {
            if (!testWork.isDirectory() && !testWork.mkdirs()) {
                throw new GradleException('Could not create the managed test working directory')
            }
        }
        useJUnitPlatform()
        maxParallelForks = 1
        maxHeapSize = '512m'
        systemProperty 'java.io.tmpdir', System.getenv('TMP') ?: System.getenv('TMPDIR')
        systemProperty 'mmmm.checkout', rootProject.projectDir.parentFile.absolutePath
        testLogging { events 'failed'; exceptionFormat = 'short' }
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

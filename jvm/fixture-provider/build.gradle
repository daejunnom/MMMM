plugins { id 'net.fabricmc.fabric-loom' }

description = 'MMMM SDK facade for the same actual legacy counter acceptance fixture'

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    api project(':provider-sdk')
    implementation project(':fixture-legacy')
}

// SDK classes are supplied by the explicit mmmm_host runtime dependency.
// The legacy mod is a separate approved source; neither JAR is nested here.
loom {
    runConfigs.configureEach {
        runDir = new File(System.getenv('TMP') ?: System.getenv('TMPDIR'), "fixture-provider-${name}").absolutePath
    }
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

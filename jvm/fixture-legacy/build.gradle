plugins { id 'net.fabricmc.fabric-loom' }

description = 'MMMM SDK-free command and public Java acceptance fixture'

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
}

// The shared root owns Java 25, compiler lint, JUnit and external outputs.
// This module deliberately has no dependency on the MMMM host or SDK.
loom {
    runConfigs.configureEach {
        runDir = new File(System.getenv('TMP') ?: System.getenv('TMPDIR'), "fixture-legacy-${name}").absolutePath
    }
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

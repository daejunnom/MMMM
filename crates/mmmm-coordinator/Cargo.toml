[package]
name = "mmmm-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Authenticated local MMMM Coordinator and shared service boundary"

[dependencies]
mmmm-application = { path = "../mmmm-application" }
mmmm-adapters = { path = "../mmmm-adapters" }
mmmm-compiler = { path = "../mmmm-compiler" }
mmmm-contracts = { path = "../mmmm-contracts" }
mmmm-domain = { path = "../mmmm-domain" }
mmmm-exchange = { path = "../mmmm-exchange" }
mmmm-planner = { path = "../mmmm-planner" }
mmmm-policy = { path = "../mmmm-policy" }
mmmm-reference = { path = "../mmmm-reference" }
mmmm-runtime = { path = "../mmmm-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom = "=0.4.3"
zeroize = "=1.8.2"
time = { version = "=0.3.44", features = ["parsing", "formatting"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials", "Win32_Security_Authorization"] }

[lints]
workspace = true

[[test]]
name = "native_stdio"
path = "tests/native_stdio.rs"
harness = false
